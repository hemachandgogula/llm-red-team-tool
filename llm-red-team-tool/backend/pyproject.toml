[tool.poetry]
name = "llm-red-team-tool-backend"
version = "0.1.0"
description = "AI/ML Model Security Testing Platform - Backend"
authors = ["LLM Red Team Tool"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.12"
redis = "^5.2.0"
celery = {extras = ["redis"], version = "^5.4.0"}
httpx = "^0.28.0"
openai = "^1.57.0"
anthropic = "^0.40.0"
scikit-learn = "^1.6.0"
numpy = "^2.2.0"
pandas = "^2.2.0"
python-dotenv = "^1.0.0"
aiofiles = "^24.1.0"
websockets = "^13.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
black = "^24.10.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
